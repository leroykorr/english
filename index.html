<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8">
 <title>English Colors Game</title>
 <style>
 body {
 font-family: Arial, sans-serif;
 background-color: #2c3e50;
 color: white;
 margin: 0;
 padding: 0;
 padding-top: 60px;
 text-align: center;
 }
 
 /* --- HOVER SETTINGS PANEL --- */
 .hover-menu {
 position: fixed;
 top: 0;
 left: 50%;
 transform: translateX(-50%);
 width: 100%;
 max-width: 900px;
 background-color: #34495e;
 border-bottom-left-radius: 15px;
 border-bottom-right-radius: 15px;
 box-shadow: 0 10px 25px rgba(0,0,0,0.5);
 z-index: 1000;
 transition: all 0.3s ease;
 }
 .hover-trigger {
 padding: 15px;
 text-align: center;
 font-weight: bold;
 font-size: 16px;
 cursor: pointer;
 color: #bdc3c7;
 transition: color 0.3s, background-color 0.3s;
 border-bottom-left-radius: 15px;
 border-bottom-right-radius: 15px;
 }
 .hover-menu:hover .hover-trigger {
 color: white;
 background-color: #3d566e;
 }
 .hover-content {
 max-height: 0;
 overflow: hidden;
 transition: max-height 0.4s ease-out;
 padding: 0 20px;
 }
 .hover-menu:hover .hover-content {
 max-height: 450px;
 padding: 0 20px 20px 20px;
 overflow: visible;
 }
 
 /* Настройки внутри панели */
 .settings-panel {
 display: flex;
 justify-content: space-around;
 gap: 15px;
 align-items: flex-start;
 margin-top: 10px;
 }
 .color-list {
 display: grid;
 grid-template-columns: repeat(4, 1fr);
 gap: 10px;
 text-align: left;
 font-size: 16px;
 margin-bottom: 10px;
 }
 .color-list label {
 cursor: pointer;
 display: flex;
 align-items: center;
 gap: 5px;
 }
 .select-btns {
 display: flex;
 gap: 10px;
 }
 .select-btns button {
 padding: 5px 10px;
 font-size: 14px;
 cursor: pointer;
 background-color: #3498db;
 color: white;
 border: none;
 border-radius: 5px;
 font-weight: bold;
 }
 .select-btns button:hover { background-color: #2980b9; }
 
 .dropdown-group {
 display: flex;
 flex-direction: column;
 gap: 15px;
 text-align: left;
 font-size: 14px;
 }
 .dropdown-group label {
 display: block;
 margin-bottom: 5px;
 font-weight: bold;
 }
 select {
 width: 100%;
 padding: 5px;
 font-size: 14px;
 border-radius: 5px;
 }
 
 /* --- TABS --- */
 .tabs {
 margin-top: 20px;
 margin-bottom: 20px;
 }
 .tab-btn {
 padding: 10px 20px;
 font-size: 18px;
 cursor: pointer;
 background-color: #7f8c8d;
 color: white;
 border: none;
 border-radius: 5px;
 margin: 0 5px;
 font-weight: bold;
 transition: 0.3s;
 }
 .tab-btn.active {
 background-color: #3498db;
 }
 
 /* --- TAB 1 (LEARN) --- */
 #tab1-content {
 display: none;
 flex-direction: column;
 align-items: center;
 }
 .flashcard {
 background-color: #ecf0f1;
 padding: 20px;
 border-radius: 15px;
 width: 300px;
 height: 350px;
 display: flex;
 flex-direction: column;
 justify-content: space-between;
 align-items: center;
 box-shadow: 0 10px 20px rgba(0,0,0,0.3);
 }
 .flashcard-color {
 width: 100%;
 height: 250px;
 border-radius: 10px;
 border: 2px solid #bdc3c7;
 }
 .flashcard-text {
 font-size: 40px;
 font-weight: bold;
 color: #2c3e50;
 margin-top: 15px;
 text-transform: uppercase;
 }
 .nav-buttons {
 display: flex;
 gap: 20px;
 margin-top: 20px;
 }
 .nav-buttons button {
 padding: 15px 30px;
 font-size: 20px;
 background-color: #2ecc71;
 color: white;
 border: none;
 border-radius: 5px;
 cursor: pointer;
 font-weight: bold;
 transition: 0.2s;
 }
 .nav-buttons button:hover { background-color: #27ae60; }

 /* --- TAB 2 (PAIRS) --- */
 #tab2-content {
 display: none;
 }
 .game-board {
 display: grid;
 grid-template-columns: repeat(auto-fit, 100px);
 gap: 15px;
 justify-content: center; 
 max-width: 800px;
 margin: 0 auto;
 }
 .card {
 width: 100px;
 height: 100px;
 perspective: 1000px;
 cursor: pointer;
 }
 .card-inner {
 width: 100%;
 height: 100%;
 position: relative;
 transition: transform 0.6s;
 transform-style: preserve-3d;
 }
 .card.flipped .card-inner { transform: rotateY(180deg); }
 .card-front, .card-back {
 width: 100%;
 height: 100%;
 position: absolute;
 backface-visibility: hidden;
 border-radius: 10px;
 display: flex;
 align-items: center;
 justify-content: center;
 font-weight: bold;
 box-shadow: 0 4px 8px rgba(0,0,0,0.2);
 }
 .card-front {
 background-color: #e74c3c;
 color: white;
 font-size: 40px;
 text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
 }
 .card-back {
 background-color: white;
 color: #2c3e50;
 transform: rotateY(180deg);
 font-size: 24px;
 flex-direction: column;
 text-transform: uppercase;
 }
 .color-block-game {
 width: 85%;
 height: 85%;
 border-radius: 8px;
 border: 2px solid #333;
 }
 .win-message {
 display: none;
 font-size: 32px;
 color: #f1c40f;
 margin-top: 20px;
 font-weight: bold;
 text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
 }
 .restart-btn {
 display: none; 
 margin-top: 20px; 
 padding: 15px 30px;
 font-size: 20px;
 background-color: #2ecc71;
 color: white;
 border: none;
 border-radius: 5px;
 cursor: pointer;
 font-weight: bold;
 }
 .restart-btn:hover { background-color: #27ae60; }

 /* --- TAB 3 (LISTEN & CHOOSE) --- */
 #tab3-content {
 display: none;
 flex-direction: column;
 align-items: center;
 }
 .listen-board {
 display: grid;
 grid-template-columns: repeat(auto-fit, 160px);
 gap: 20px;
 justify-content: center;
 max-width: 900px;
 margin: 0 auto 30px auto;
 }
 .listen-card {
 background-color: white;
 border-radius: 10px;
 height: 180px;
 display: flex;
 flex-direction: column;
 box-shadow: 0 5px 15px rgba(0,0,0,0.3);
 overflow: hidden;
 position: relative;
 }
 .listen-letter {
 position: absolute;
 top: 5px;
 left: 8px;
 background-color: #34495e;
 color: white;
 font-size: 22px;
 font-weight: bold;
 padding: 2px 10px;
 border-radius: 5px;
 z-index: 10;
 }
 .listen-color-box {
 flex-grow: 1;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 padding: 25px 10px 10px 10px;
 }
 .listen-text {
 font-size: 22px;
 font-weight: bold;
 color: #2c3e50;
 margin-top: 10px;
 text-transform: uppercase;
 }
 .shuffle-btn {
 padding: 15px 40px;
 font-size: 24px;
 background-color: #9b59b6;
 color: white;
 border: none;
 border-radius: 5px;
 cursor: pointer;
 font-weight: bold;
 box-shadow: 0 4px 8px rgba(0,0,0,0.3);
 transition: 0.2s;
 }
 .shuffle-btn:hover { background-color: #8e44ad; }

 /* --- TAB 4 (WHO IS FASTER) --- */
 #tab4-content {
 display: none;
 flex-direction: column;
 align-items: center;
 }
 .faster-display {
 background-color: #34495e;
 border-radius: 15px;
 width: 100%;
 max-width: 600px;
 height: 450px;
 display: flex;
 flex-direction: column;
 justify-content: center;
 align-items: center;
 margin: 0 auto 20px auto;
 box-shadow: 0 10px 20px rgba(0,0,0,0.5);
 overflow: hidden;
 }
 .faster-controls button {
 padding: 15px 30px;
 font-size: 20px;
 margin: 0 10px;
 border: none;
 border-radius: 5px;
 cursor: pointer;
 font-weight: bold;
 color: white;
 }
 .btn-start { background-color: #2ecc71; }
 .btn-start:hover { background-color: #27ae60; }
 .btn-pause { background-color: #e67e22; }
 .btn-pause:hover { background-color: #d35400; }
 .btn-pause:disabled { background-color: #7f8c8d; cursor: not-allowed; }
 </style>
</head>
<body>

 <!-- HOVER SETTINGS PANEL -->
 <div class="hover-menu">
 <div class="hover-trigger">Hover here to start ⬇</div>
 <div class="hover-content">
 <div class="settings-panel">
 <div>
 <strong>1. Select colors:</strong>
 <div class="color-list" id="color-checkboxes"></div>
 <div class="select-btns">
 <button onclick="selectAllColors()">Select All</button>
 <button onclick="deselectAllColors()">Clear All</button>
 </div>
 </div>
 <div class="dropdown-group">
 <div>
 <label>2. Difficulty (All Tabs):</label>
 <select id="difficulty-level" onchange="applySettings()">
 <option value="1">Level 1 (Picture)</option>
 <option value="2" selected>Level 2 (Picture + Word)</option>
 <option value="3">Level 3 (Word)</option>
 </select>
 </div>
 <div>
 <label>3. Letters for Tab 3:</label>
 <select id="letter-mode" onchange="applySettings()">
 <option value="sequential">Sequential (A, B, C...)</option>
 <option value="random">Random (Z, Y, H...)</option>
 </select>
 </div>
 <div>
 <label>4. Numbers for Pairs (Tab 2):</label>
 <select id="card-number-mode" onchange="applySettings()">
 <option value="1">Start from 1</option>
 <option value="12">Start from 12</option>
 <option value="random">Random (12+)</option>
 </select>
 </div>
 </div>
 </div>
 </div>
 </div>

 <!-- TABS -->
 <div class="tabs">
 <button class="tab-btn active" onclick="switchTab(1)">Tab 1: Learn</button>
 <button class="tab-btn" onclick="switchTab(2)">Tab 2: Pairs</button>
 <button class="tab-btn" onclick="switchTab(3)">Tab 3: Listen & Choose</button>
 <button class="tab-btn" onclick="switchTab(4)">Tab 4: Who is faster?</button>
 </div>

 <!-- TAB 1 -->
 <div id="tab1-content">
 <div class="flashcard" id="flashcard">
 <div class="flashcard-color" id="fc-color"></div>
 <div class="flashcard-text" id="fc-text"></div>
 </div>
 <div class="nav-buttons">
 <button onclick="prevFlashcard()">Previous</button>
 <button onclick="nextFlashcard()">Next</button>
 </div>
 </div>

 <!-- TAB 2 -->
 <div id="tab2-content">
 <div class="game-board" id="game-board"></div>
 <div class="win-message" id="win-message"> Great job! You found all the pairs! </div>
 <button class="restart-btn" id="restart-btn" onclick="startGame()">Play Again</button>
 </div>

 <!-- TAB 3 -->
 <div id="tab3-content">
 <div class="listen-board" id="listen-board"></div>
 <button class="shuffle-btn" onclick="initListenBoard()">Shuffle</button>
 </div>

 <!-- TAB 4 -->
 <div id="tab4-content">
 <div class="faster-display" id="faster-display">
 <h1 style="color: #bdc3c7;">Press Start</h1>
 </div>
 <div class="faster-controls">
 <button id="faster-start-btn" class="btn-start" onclick="startFasterGame()">Start</button>
 <button id="faster-pause-btn" class="btn-pause" onclick="togglePauseFasterGame()" disabled>Pause</button>
 </div>
 </div>

 <script>
 // COLORS DATABASE
 const allColors = [
 { name: "RED", hex: "#FF0000" },
 { name: "BLUE", hex: "#0000FF" },
 { name: "GREEN", hex: "#008000" },
 { name: "YELLOW", hex: "#FFFF00" },
 { name: "ORANGE", hex: "#FFA500" },
 { name: "PURPLE", hex: "#800080" },
 { name: "PINK", hex: "#FFC0CB" },
 { name: "BROWN", hex: "#6F4E37" },
 { name: "BLACK", hex: "#000000" },
 { name: "WHITE", hex: "#FFFFFF" },
 { name: "GREY", hex: "#808080" },
 { name: "GOLD", hex: "linear-gradient(135deg, #D4AF37, #FFF8DC, #D4AF37)" }
 ];

 let selectedColors = [];
 let currentLevel = 2;
 let currentLetterMode = 'sequential';
 let currentNumberMode = '1'; // 1, 12, random
 
 // Tab 1
 let fcIndex = 0;

 // Tab 2
 let cardsData = [];
 let hasFlippedCard = false;
 let lockBoard = false;
 let firstCard, secondCard;
 let matchedPairs = 0;

 // Tab 4
 let fasterRunning = false;
 let fasterPaused = false;
 let fasterSequence = [];

 // --- INIT ---
 window.onload = function() {
 renderCheckboxes();
 for(let i=0; i<4; i++) {
 document.getElementById('color-chk-'+i).checked = true;
 }
 applySettings();
 };

 function renderCheckboxes() {
 const container = document.getElementById('color-checkboxes');
 allColors.forEach((color, index) => {
 const label = document.createElement('label');
 label.innerHTML = `<input type="checkbox" id="color-chk-${index}" value="${index}" onchange="applySettings()"> ${color.name}`;
 container.appendChild(label);
 });
 }

 function selectAllColors() {
 document.querySelectorAll('#color-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = true);
 applySettings();
 }

 function deselectAllColors() {
 document.querySelectorAll('#color-checkboxes input[type="checkbox"]').forEach(cb => cb.checked = false);
 applySettings();
 }

 function applySettings() {
 selectedColors = [];
 const checkboxes = document.querySelectorAll('#color-checkboxes input[type="checkbox"]:checked');
 
 if(checkboxes.length === 0) {
 document.getElementById('fc-text').innerText = "Select colors";
 document.getElementById('fc-color').style.background = "transparent";
 document.getElementById('game-board').innerHTML = "";
 document.getElementById('listen-board').innerHTML = "";
 return;
 }

 checkboxes.forEach(cb => {
 selectedColors.push(allColors[cb.value]);
 });

 currentLevel = parseInt(document.getElementById('difficulty-level').value);
 currentLetterMode = document.getElementById('letter-mode').value;
 currentNumberMode = document.getElementById('card-number-mode').value;
 
 fcIndex = 0;
 updateFlashcard();
 startGame();
 initListenBoard();
 
 if (fasterRunning) stopFasterGame();
 }

 function switchTab(tabNum) {
 for(let i=1; i<=4; i++) {
 document.getElementById('tab'+i+'-content').style.display = 'none';
 }
 document.getElementById('tab'+tabNum+'-content').style.display = (tabNum === 2) ? 'block' : 'flex';
 
 const btns = document.querySelectorAll('.tab-btn');
 btns.forEach((btn, i) => btn.classList.toggle('active', i === tabNum - 1));

 if (tabNum !== 4 && fasterRunning) {
 stopFasterGame();
 }
 }

 // --- SHUFFLE HELPER ---
 function shuffle(array) {
 let currentIndex = array.length, randomIndex;
 let tempArray = [...array]; 
 while (currentIndex !== 0) {
 randomIndex = Math.floor(Math.random() * currentIndex);
 currentIndex--;
 [tempArray[currentIndex], tempArray[randomIndex]] = [tempArray[randomIndex], tempArray[currentIndex]];
 }
 return tempArray;
 }

 // --- TAB 1 ---
 function updateFlashcard() {
 if(selectedColors.length === 0) return;
 const currentColor = selectedColors[fcIndex];
 document.getElementById('fc-color').style.background = currentColor.hex;
 document.getElementById('fc-text').innerText = currentColor.name;
 }

 function nextFlashcard() {
 if(selectedColors.length === 0) return;
 fcIndex = (fcIndex + 1) % selectedColors.length;
 updateFlashcard();
 }

 function prevFlashcard() {
 if(selectedColors.length === 0) return;
 fcIndex--;
 if(fcIndex < 0) fcIndex = selectedColors.length - 1;
 updateFlashcard();
 }

 // --- TAB 2 (PAIRS) ---
 function startGame() {
 const board = document.getElementById('game-board');
 board.innerHTML = '';
 cardsData = [];
 matchedPairs = 0;
 hasFlippedCard = false;
 lockBoard = false;
 document.getElementById('win-message').style.display = 'none';
 document.getElementById('restart-btn').style.display = 'none';

 if (selectedColors.length === 0) return;

 selectedColors.forEach(color => {
 if (currentLevel === 1) {
 cardsData.push({ type: 'color', value: color.name, hex: color.hex });
 cardsData.push({ type: 'color', value: color.name, hex: color.hex });
 } else if (currentLevel === 2) {
 cardsData.push({ type: 'color', value: color.name, hex: color.hex });
 cardsData.push({ type: 'text', value: color.name });
 } else if (currentLevel === 3) {
 cardsData.push({ type: 'text', value: color.name });
 cardsData.push({ type: 'text', value: color.name });
 }
 });

 // Генерация номеров для карточек (новая логика)
 let cardNumbers = [];
 if (currentNumberMode === 'random') {
 let pool = [];
 for(let i=12; i<=50; i++) pool.push(i);
 pool = shuffle(pool);
 cardNumbers = pool.slice(0, cardsData.length);
 }

 shuffle(cardsData).forEach((cardInfo, index) => {
 const card = document.createElement('div');
 card.classList.add('card');
 card.dataset.value = cardInfo.value;

 let backContent = cardInfo.type === 'text' ? cardInfo.value : `<div class="color-block-game" style="background: ${cardInfo.hex};"></div>`;

 // Определение номера на рубашке
 let frontNumber = index + 1;
 if (currentNumberMode === '12') frontNumber = index + 12;
 if (currentNumberMode === 'random') frontNumber = cardNumbers[index];

 card.innerHTML = `
 <div class="card-inner">
 <div class="card-front">${frontNumber}</div>
 <div class="card-back">${backContent}</div>
 </div>
 `;

 card.addEventListener('click', flipCard);
 board.appendChild(card);
 });
 }

 function flipCard() {
 if (lockBoard || this === firstCard) return;
 this.classList.add('flipped');
 if (!hasFlippedCard) {
 hasFlippedCard = true;
 firstCard = this;
 return;
 }
 secondCard = this;
 checkForMatch();
 }

 function checkForMatch() {
 let isMatch = firstCard.dataset.value === secondCard.dataset.value;
 if (isMatch) disableCards();
 else unflipCards();
 }

 function disableCards() {
 firstCard.removeEventListener('click', flipCard);
 secondCard.removeEventListener('click', flipCard);
 matchedPairs++;
 if (matchedPairs === selectedColors.length) {
 setTimeout(() => {
 document.getElementById('win-message').style.display = 'block';
 document.getElementById('restart-btn').style.display = 'inline-block';
 }, 500);
 }
 resetBoard();
 }

 function unflipCards() {
 lockBoard = true;
 setTimeout(() => {
 firstCard.classList.remove('flipped');
 secondCard.classList.remove('flipped');
 resetBoard();
 }, 1000);
 }

 function resetBoard() {
 [hasFlippedCard, lockBoard] = [false, false];
 [firstCard, secondCard] = [null, null];
 }

 // --- TAB 3 (LISTEN & CHOOSE) ---
 function initListenBoard() {
 const board = document.getElementById('listen-board');
 board.innerHTML = '';
 if (selectedColors.length === 0) return;

 let displayColors = shuffle(selectedColors);
 
 let letters = [];
 const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
 
 if (currentLetterMode === 'sequential') {
 for (let i = 0; i < displayColors.length; i++) {
 letters.push(alphabet[i % 26]);
 }
 } else {
 let availableLetters = alphabet.split('');
 availableLetters = shuffle(availableLetters);
 for (let i = 0; i < displayColors.length; i++) {
 letters.push(availableLetters[i % 26]);
 }
 letters = shuffle(letters); 
 }

 displayColors.forEach((color, index) => {
 const card = document.createElement('div');
 card.classList.add('listen-card');
 
 let content = '';
 if (currentLevel === 1) {
 content = `<div class="listen-color-box"><div class="color-block-game" style="background: ${color.hex}; width: 90px; height: 90px; border-radius: 5px;"></div></div>`;
 } else if (currentLevel === 2) {
 content = `<div class="listen-color-box"><div class="color-block-game" style="background: ${color.hex}; width: 90px; height: 90px; border-radius: 5px;"></div><div class="listen-text">${color.name}</div></div>`;
 } else if (currentLevel === 3) {
 content = `<div class="listen-color-box"><div class="listen-text" style="font-size: 32px;">${color.name}</div></div>`;
 }

 card.innerHTML = `
 <div class="listen-letter">${letters[index]}</div>
 ${content}
 `;
 board.appendChild(card);
 });
 }

 // --- TAB 4 (WHO IS FASTER) ---
 async function sleep(ms) {
 const start = Date.now();
 while (Date.now() - start < ms) {
 if (!fasterPaused) {
 await new Promise(r => setTimeout(r, 50));
 } else {
 await new Promise(r => setTimeout(r, 100));
 }
 }
 while (fasterPaused && fasterRunning) {
 await new Promise(r => setTimeout(r, 100));
 }
 }

 async function startFasterGame() {
 if (fasterRunning) {
 stopFasterGame();
 return;
 }

 if (selectedColors.length === 0) {
 alert("Please select at least one color first!");
 return;
 }

 fasterRunning = true;
 fasterPaused = false;
 fasterSequence = shuffle(selectedColors);

 const startBtn = document.getElementById('faster-start-btn');
 startBtn.innerText = 'Stop';
 startBtn.style.backgroundColor = '#e74c3c';
 document.getElementById('faster-pause-btn').disabled = false;
 document.getElementById('faster-pause-btn').innerText = 'Pause';

 const display = document.getElementById('faster-display');

 for (let i = 0; i < fasterSequence.length; i++) {
 if (!fasterRunning) break;

 for (let j = 3; j > 0; j--) {
 if (!fasterRunning) break;
 display.innerHTML = `<h1 style="font-size: 150px; margin: 0; color: #ecf0f1;">${j}</h1>`;
 await sleep(1000);
 }
 if (!fasterRunning) break;

 const currentColor = fasterSequence[i];
 let cardHTML = '';
 
 if (currentLevel === 1) {
 cardHTML = `<div class="flashcard" style="width: 320px; height: 320px; display: flex; justify-content: center; align-items: center;"><div class="flashcard-color" style="background: ${currentColor.hex}; width: 280px; height: 280px; margin: 0;"></div></div>`;
 } else if (currentLevel === 2) {
 cardHTML = `<div class="flashcard" style="width: 320px; height: 380px; display: flex; flex-direction: column; justify-content: center; align-items: center;"><div class="flashcard-color" style="background: ${currentColor.hex}; width: 280px; height: 250px; margin: 0;"></div><div class="flashcard-text" style="margin-top: 15px;">${currentColor.name}</div></div>`;
 } else if (currentLevel === 3) {
 cardHTML = `<div class="flashcard" style="width: 320px; height: 380px; display: flex; justify-content: center; align-items: center;"><div class="flashcard-text" style="font-size: 80px; margin: 0;">${currentColor.name}</div></div>`;
 }
 
 display.innerHTML = cardHTML;
 await sleep(3000);
 if (!fasterRunning) break;

 if (i < fasterSequence.length - 1) {
 display.innerHTML = `<h1 style="font-size: 60px; margin: 0; color: #f1c40f;">Are you ready?</h1>`;
 await sleep(3000);
 if (!fasterRunning) break;
 }
 }

 if (fasterRunning) {
 fasterRunning = false;
 display.innerHTML = `<h1 style="font-size: 80px; margin: 0; color: #2ecc71;">Well done!</h1>`;
 startBtn.innerText = 'Start Again';
 startBtn.style.backgroundColor = '#2ecc71';
 document.getElementById('faster-pause-btn').disabled = true;
 }
 }

 function stopFasterGame() {
 fasterRunning = false;
 fasterPaused = false;
 const startBtn = document.getElementById('faster-start-btn');
 startBtn.innerText = 'Start';
 startBtn.style.backgroundColor = '#2ecc71';
 document.getElementById('faster-pause-btn').disabled = true;
 document.getElementById('faster-pause-btn').innerText = 'Pause';
 document.getElementById('faster-display').innerHTML = '<h1 style="color: #bdc3c7;">Press Start</h1>';
 }

 function togglePauseFasterGame() {
 if (!fasterRunning) return;
 fasterPaused = !fasterPaused;
 document.getElementById('faster-pause-btn').innerText = fasterPaused ? 'Resume' : 'Pause';
 }
 </script>
</body>
</html>
